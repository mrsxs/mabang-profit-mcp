<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 12px 14px; font: 13px/1.5 -apple-system, "PingFang SC", sans-serif; color: #24313a; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; margin: 4px 0; }
  .ok { color: #2f7d4f; } .bad { color: #b0432c; } .muted { color: #7a8790; }
  label { display: flex; gap: 6px; align-items: flex-start; margin: 10px 0 6px; cursor: pointer; }
  button { margin-top: 4px; padding: 4px 10px; }
  #msg { margin-top: 6px; font-size: 12px; }
</style>
</head>
<body>
<h1>马帮利润助手</h1>
<div class="row"><span>马帮利润工具（Accio 等）</span><span id="hub" class="muted">-</span></div>
<div class="row"><span>利润报表页</span><span id="finance" class="muted">-</span></div>
<div class="row"><span>库存 SKU 页</span><span id="stock" class="muted">-</span></div>
<div class="row"><span>订单页</span><span id="order" class="muted">-</span></div>
<label><input type="checkbox" id="always-on"><span>常开马帮页：后台一直开着利润报表、库存 SKU 和订单页，查得更快（要先登录马帮；取消勾选后闲置 10 分钟自动关掉）</span></label>
<button id="open-now">现在打开马帮页</button>
<div id="msg" class="muted"></div>
<script src="popup.js"></script>
</body>
</html>
